<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AI Receptionist – WS Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 2rem; }
    button { padding: .6rem 1rem; font-size: 1rem; margin-right: .5rem; }
    #log { white-space: pre-line; margin-top: 1rem; }
    .row { margin:.4rem 0; }
    .you { color:#444; }
    .bot { color:#0a5; }
    .status { margin-left:.5rem; font-size:.9rem; color:#666; }
    #live { color:#999; font-style:italic; }
  </style>
</head>
<body>
  <h1>AI Receptionist (WebSocket Demo)</h1>
  <p>
    Click Start, allow mic. Speak → Whisper → EOS → LLM → Azure TTS streamed back.
    <span class="status" id="status">Idle</span>
  </p>
  <button id="start">Start</button>
  <button id="stop" disabled>Stop</button>
  <button id="beep" disabled>Test Beep</button>
  <label style="margin-left:.5rem">Gain
    <input id="gain" type="range" min="0" max="2" value="1" step="0.05">
  </label>

  <div id="history" style="margin-top:1rem"></div>
  <div id="live" class="row" style="color:#888;font-style:italic"></div>
  <div id="log" style="white-space:pre-line;margin-top:1rem;color:#555"></div>

<script>
const log = (s)=>{ document.getElementById('log').textContent += s + "\n"; };
const setStatus = (s)=>{ document.getElementById('status').textContent = s; };
const historyEl = document.getElementById('history');
const liveEl = document.getElementById('live');

let ws, audioCtx, micNode, ttsNode, gainNode;
let running = false;

const State = Object.freeze({ IDLE:0, LISTENING:1, THINKING:2, SPEAKING:3 });
let state = State.IDLE;
let listening = false;
let liveText = "";

function appendUserLine(text) {
  const row = document.createElement('div');
  row.className = 'row';
  row.textContent = `You: ${text}`;
  historyEl.appendChild(row);
}
function appendBotLine(text) {
  const row = document.createElement('div');
  row.className = 'row';
  row.style.color = '#0a5';
  row.textContent = `Assistant: ${text}`;
  historyEl.appendChild(row);
}

function beginListening(){ state=State.LISTENING; listening=true; liveText=""; liveEl.textContent=""; setStatus("Listening…"); }
function beginThinking(){ state=State.THINKING; listening=false; setStatus("Thinking…"); }
function beginSpeaking(){ state=State.SPEAKING; listening=false; setStatus("Speaking…"); }
function endSpeakingThenListen(){ beginListening(); }

async function ensureCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({latencyHint:'interactive'});
  }
  if (audioCtx.state !== 'running') { try { await audioCtx.resume(); } catch {} }
}

class PCM24Player {
  constructor(ctx){
    this.ctx = ctx;
    this.workletNode = null;
  }
  async init(){
    if (this.workletNode) return;
    await this.ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([`
      class PCM24Sink extends AudioWorkletProcessor {
        constructor(){
          super();
          this.buf = [];
          this.r = 24000;
          this.gain = 1.0;
          this.port.onmessage = (e)=>{
            const d = e.data||{};
            if (d.cmd === 'push' && d.f32) this.buf.push(d.f32);
            if (d.cmd === 'gain' && typeof d.value === 'number') this.gain = d.value;
          };
        }
        process(inputs, outputs){
          const out = outputs[0];
          if (!out || out.length === 0) return true;
          const ch = out[0];  // mono
          ch.fill(0);
          let filled = 0;
          while (filled < ch.length && this.buf.length){
            const chunk = this.buf.shift(); // Float32 @ 24k
            const ratio = sampleRate / this.r;
            const upLen = Math.max(1, Math.round(chunk.length * ratio));
            for (let i=0;i<upLen && filled<ch.length;i++){
              const idx = Math.min(chunk.length-1, Math.floor(i/ratio));
              ch[filled++] = chunk[idx] * this.gain;
            }
          }
          return true;
        }
      }
      registerProcessor('pcm24-sink', PCM24Sink);
    `], {type:'application/javascript'})));
    this.workletNode = new AudioWorkletNode(this.ctx, 'pcm24-sink', { numberOfOutputs: 1, outputChannelCount: [1] });
    // Hook up to a gainNode (master gain)
    if (!gainNode) {
      gainNode = this.ctx.createGain();
      gainNode.gain.value = parseFloat(document.getElementById('gain').value);
      document.getElementById('gain').oninput = (e)=>{
        const v = parseFloat(e.target.value);
        gainNode.gain.value = v;
        if (this.workletNode) this.workletNode.port.postMessage({cmd:'gain', value:v});
      };
    }
    this.workletNode.connect(gainNode).connect(this.ctx.destination);
    // Initialize gain in processor too
    this.workletNode.port.postMessage({cmd:'gain', value: gainNode.gain.value});
  }
  async pushInt16Mono24k(bytes){
    await ensureCtx();
    await this.init();
    const s16 = new Int16Array(bytes.buffer, bytes.byteOffset, Math.floor(bytes.byteLength/2));
    const f32 = new Float32Array(s16.length);
    for (let i=0;i<s16.length;i++) f32[i] = Math.max(-1, Math.min(1, s16[i]/32768));
    this.workletNode.port.postMessage({cmd:'push', f32}, [f32.buffer]);
  }
}

let ttsPlayer = null;

async function setupMic(ctx){
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([`
    class MicProcessor extends AudioWorkletProcessor {
      constructor(){ super(); this.decim = Math.max(1, Math.round(sampleRate / 16000)); }
      process(inputs){
        const input = inputs[0]; if (!input || input.length === 0) return true;
        const ch0 = input[0]; if (!ch0) return true;
        const step = this.decim;
        const outLen = Math.floor(ch0.length / step);
        const f32_16k = new Float32Array(outLen);
        for (let i=0,j=0; j<outLen; i+=step, j++) f32_16k[j] = ch0[i];
        const FRAME = 320;
        for (let idx = 0; idx < f32_16k.length; idx += FRAME) {
          const slice = f32_16k.subarray(idx, Math.min(f32_16k.length, idx + FRAME));
          this.port.postMessage(slice, [slice.buffer]);
        }
        return true;
      }
    }
    registerProcessor('mic-proc', MicProcessor);
  `], {type:'application/javascript'})));

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio:true, video:false});
  } catch (e) {
    log('[mic] error: ' + (e?.message || e)); 
    log('Tip: open over HTTPS or use an SSH tunnel and visit http://localhost.');
    throw e;
  }
  const src = ctx.createMediaStreamSource(stream);
  micNode = new AudioWorkletNode(ctx, 'mic-proc');
  micNode.port.onmessage = (e)=>{
    if (!listening || !ws || ws.readyState !== WebSocket.OPEN) return;
    const f32 = e.data; // Float32Array (16k mono)
    ws.send(f32.buffer);
  };
  src.connect(micNode);
}

document.getElementById('start').onclick = async () => {
  if (running) return;
  running = true;
  document.getElementById('start').disabled = true;
  document.getElementById('stop').disabled = false;
  document.getElementById('beep').disabled = false;

  await ensureCtx();
  ttsPlayer = new PCM24Player(audioCtx);
  await ttsPlayer.init();
  await setupMic(audioCtx);

  const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.hostname + ':8765';
  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';

  ws.onopen = async () => {
    log('[ws] connected');
    await ensureCtx();  // user gesture already happened
    ws.send(JSON.stringify({type:'hello'}));
    beginListening();
  };

  ws.onmessage = async (ev) => {
    if (typeof ev.data === 'string'){
      const msg = JSON.parse(ev.data);
      if (msg.type === 'ack') log('[ws] ack');
      if (msg.type === 'partial' && state === State.LISTENING'){
        liveText = msg.text || '';
        liveEl.textContent = liveText ? `… ${liveText}` : '';
      }
      if (msg.type === 'assistant_text'){
        if (liveText) { appendUserLine(liveText); liveText = ""; liveEl.textContent = ""; }
        beginThinking();
        appendBotLine(msg.text || '');
      }
      if (msg.type === 'tts_start'){
        log('[tts] start');
        await ensureCtx();
        beginSpeaking();
      }
      if (msg.type === 'tts_end'){
        log('[tts] end');
        endSpeakingThenListen();
      }
      if (msg.type === 'tts_error'){
        log('[tts_error] ' + (msg.message || 'unknown'));
        // bounce back to listening even on error
        endSpeakingThenListen();
      }
    } else {
      // Binary = 24k int16 PCM
      if (state !== State.SPEAKING) beginSpeaking();
      await ensureCtx();
      const buf = new Uint8Array(ev.data);
      await ttsPlayer.pushInt16Mono24k(buf);
    }
  };

  ws.onclose = ()=> { log('[ws] closed'); state = State.IDLE; listening = false; setStatus('Idle'); };
};

document.getElementById('stop').onclick = async () => {
  running = false; listening = false;
  if (ws && ws.readyState === WebSocket.OPEN){ ws.send(JSON.stringify({type:'eos'})); ws.close(); }
  try { if (audioCtx) await audioCtx.close(); } catch {}
  audioCtx = null; ttsPlayer = null;
  document.getElementById('start').disabled = false;
  document.getElementById('stop').disabled = true;
  document.getElementById('beep').disabled = true;
  setStatus('Idle');
};

document.getElementById('beep').onclick = async () => {
  await ensureCtx();
  // Play 400 Hz beep for 0.3s through the SAME context/output path
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  g.gain.value = parseFloat(document.getElementById('gain').value);
  o.frequency.value = 400;
  o.connect(g).connect(audioCtx.destination);
  o.start();
  setTimeout(()=>{ try{o.stop();o.disconnect();g.disconnect();}catch{} }, 300);
};
</script>
</body>
</html>
